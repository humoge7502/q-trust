# DVC pipeline — ML Factory data versioning.
#
# D-3 fix (2026-09-03): the previous dvc.yaml declared 8 stages, but 7 of the
# `python -m qtrust.…` module entry points did not exist (the modules define
# library functions only, no __main__ CLI), so `dvc repro` failed at the first
# stage and the pipeline was decorative. The two stages below are the ones
# whose entry point and outputs are real today:
#
#   * evaluate — `qtrust/evaluation/run_all.py` has a __main__ CLI taking
#     --splits / --out, and runs honestly (it refuses to fabricate metrics
#     when splits are missing, see REG-08).
#
# Stages for ingest → bronze → silver → gold → splits → model training are
# deliberately NOT declared until their module entry points exist. Add a stage
# here only when `python -m <module>` runs end-to-end; a pipeline that cannot
# reproduce is worse than no pipeline.
#
# To re-check stage claims: `dvc repro --dry` (or `python -m <stage module>`).

stages:
  evaluate:
    cmd: python -m qtrust.evaluation.run_all --splits qtrust_data/splits --out qtrust_bench/evaluation/report.json
    deps:
      - qtrust/evaluation/run_all.py
      - qtrust/evaluation/metrics.py
      - qtrust_data/splits
    outs:
      - qtrust_bench/evaluation/report.json:
          cache: false
