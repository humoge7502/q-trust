# Gitleaks configuration — default ruleset + documented false-positive allowlist.
#
# Why this file exists: the scheduled full-history scan flagged 15 findings, all
# `generic-api-key` false positives. Every allowlisted value below is
# public-by-construction or a test fixture:
#
#   - Anvil/Foundry accounts #0–#2 are deterministic, published development
#     keys (pre-funded on every local chain; useless anywhere else). The
#     `dev-key-guard` CI job in .github/workflows/security.yml rejects these
#     exact literals in non-test files, so this allowlist cannot mask a real
#     misuse of them.
#   - The repeated `0123456789abcdef…` hex is the dummy TEST_KEY used by
#     backend unit tests.
#   - `z6Mkh…` is the canonical example DID:key Ed25519 PUBLIC key from the
#     W3C did:key spec, used by the SDK property tests.
#   - `X25519MLKEM768` is an IANA-registered TLS cipher-suite name that
#     appears in an inspector recommendation string ("hybrid PQC key
#     exchange: …") — an algorithm name, not a credential.
#
# Any other high-entropy string still trips `generic-api-key` as normal.

[extend]
useDefault = true

[allowlist]
description = "Public-by-construction dev keys and documented test fixtures"
regexes = [
  # Anvil/Foundry deterministic dev accounts #0, #1, #2 (published by the
  # Foundry book; guarded outside test fixtures by the dev-key-guard job).
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  # Dummy 32-byte TEST_KEY (repeating 0123456789abcdef) in backend unit tests.
  '''0123456789abcdef(0123456789abcdef){3}''',
  # W3C did:key spec example Ed25519 public key (public by definition).
  '''z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK''',
  # IANA TLS 1.3 hybrid cipher-suite name in an inspector recommendation string.
  '''X25519MLKEM768''',
]
