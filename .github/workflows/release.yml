# Q-Trust — GitHub Release automation
#
# Why this file exists: VoltHub has tag-driven GitHub Releases with notes
# extracted from CHANGELOG.md; Q-Trust publishes to PyPI/Docker but had no
# equivalent GitHub Release job. This closes that gap and makes the release
# itself carry receipts: the wheel artifact plus a build provenance attestation
# — a tool that preaches attestation should ship its own artifacts attested.
#
# Trigger model: pushing a tag `v1.2.3` extracts the matching CHANGELOG.md
# section as release notes, builds the wheel, attests it, and publishes the
# GitHub Release.
#
# NOTE: check publish-pypi.yml / publish-docker.yml triggers. If they fire on
# `release: types: [published]`, this workflow feeds them naturally. If they
# also fire on `push: tags: v*`, remove the tag trigger there so PyPI is not
# published twice.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Build, attest, publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # OIDC for build provenance attestation
      attestations: write    # store the attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: 'dist/*'

      - name: Extract changelog section for this tag
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}   # e.g. v1.2.3
        run: |
          python3 - <<'PY'
          import os, re

          tag = os.environ["TAG_NAME"].lstrip("v")   # -> 1.2.3
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Keep-a-Changelog: section header like "## [1.2.3] - 2026-09-01"
          m = re.search(
              rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          body = (m.group(1).strip() if m
                  else f"Release {os.environ['TAG_NAME']} - see CHANGELOG.md for details.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("body<<EOF\n" + body + "\nEOF\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: dist/*
          fail_on_unmatched_files: true
