name: Workflow Lint (actionlint)

# REG-01 remediation: the main CI triggers were once corrupted
# ("branches: ain]") and every downstream check silently stopped gating
# main. This workflow validates all workflow files on every push/PR so a
# syntax error in any workflow file is caught immediately — it must never
# depend on another workflow's triggers being valid.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # S-8 fix: download a pinned release asset and verify it against the
      # official checksums file instead of piping an unpinned script from
      # `main` into bash. Version + expected checksum are pinned below; update
      # both together.
      - name: Download actionlint (pinned release, checksum-verified)
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      - name: Run actionlint on all workflow files
        run: ./actionlint -color
